# ---------------------------------------------------------------------------
# LiteLLM gateway (Google AI Studio) — the single egress point to Google.
#
# `model_list` is an ALLOW-LIST. A model absent from this file cannot be
# reached through the proxy, whatever a client asks for.
# ---------------------------------------------------------------------------

model_list:
  # Primary chat model.
  - model_name: gemini-3.8-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: chat

  # Fallback + cheap utility model (OpenWebUI uses it for chat titles/tags).
  - model_name: gemini-3.5-flash
    litellm_params:
      model: gemini/gemini-3.5-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: chat
      display_name: "gemini-flash"

  # Cheapest chat model.
  - model_name: gemini-3.5-flash-lite
    litellm_params:
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: chat
      display_name: "gemini-flash-lite"

  # Image generation, called through /chat/completions.
  - model_name: gemini-3.1-flash-image
    litellm_params:
      model: gemini/gemini-3.1-flash-image
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: chat
      display_name: "nano banana 2"

  # The demo ADK agent, reached over A2A. LiteLLM accepts an OpenAI-style
  # /v1/chat/completions call for this model, maps it to A2A JSON-RPC
  # (message/send or message/stream) against api_base, and translates the
  # agent's reply back. mode is "chat" so Open WebUI treats it as a model.
  - model_name: weather-time-agent
    litellm_params:
      model: a2a/weather-time-agent
      # Point the bridge straight at the agent. Without this it resolves the
      # api_base from the registry's agent card, whose url is LiteLLM's own
      # proxy endpoint — the call then loops back into the proxy instead of
      # reaching the agent, and you silently get a plain LLM answer.
      api_base: http://adk-agent:8080
    model_info:
      mode: chat
      display_name: "Weather & Time Agent"
      # LiteLLM's A2A -> OpenAI chat bridge loses the body of a streamed
      # reply: it does call the agent with message/stream and the agent does
      # return a correct SSE stream, but the bridge emits only a terminal
      # chunk, so the client sees an empty message. Non-streaming is correct,
      # and the native /a2a/{agent} passthrough streams correctly too — the
      # defect is specific to the chat-completions bridge.
      # provision.sh reads this flag and marks the model non-streaming in
      # Open WebUI, which otherwise streams by default.
      supports_native_streaming: false

  # Embeddings for document upload / RAG.
  - model_name: gemini-embedding-001
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      mode: embedding

litellm_settings:
  # Do not write prompt or completion text to logs or the spend database.
  # Spend and token counts are still recorded; message content is not.
  turn_off_message_logging: true
  redact_user_api_key_info: true

  telemetry: false
  drop_params: true          # silently drop params Gemini does not accept
  num_retries: 2
  request_timeout: 600

  # Response caching is OFF: cached prompts would sit in Redis. Enable only
  # if you accept that trade-off (see README).
  cache: false

  default_fallbacks: ["gemini-3.5-flash"]

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Persist virtual keys / teams / budgets created in the admin UI.
  store_model_in_db: true
  # Never persist prompt bodies alongside spend records.
  store_prompts_in_spend_logs: false

router_settings:
  routing_strategy: simple-shuffle
  # Redis backs cross-worker rate limiting so limits hold with >1 worker.
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT

# ---------------------------------------------------------------------------
# A2A agent registry (the documented way to register agents).
# Registering here also gives the native A2A surface:
#   POST /a2a/weather-time-agent               JSON-RPC passthrough
#   GET  /a2a/weather-time-agent/.well-known/agent-card.json
#   GET  /v1/a2a/discover
# and lets virtual keys / teams be granted or denied per agent.
# The model_list entry above bridges the same agent to /v1/chat/completions
# for Open WebUI.
# ---------------------------------------------------------------------------
agents:
  - agent_name: weather-time-agent
    agent_card_params:
      name: "Weather & Time Agent"
      description: "Reports the weather and current time for a city."
      url: "http://adk-agent:8080"
      protocolVersion: "1.0"
